<!doctype html>
<html lang="de">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Cache-control" content="no-cache">
	<link rel="stylesheet" type="text/css" href="style.css">
	<title>Wetter</title>
	<SCRIPT>
		window.addEventListener('load', () => {
			loadName();
		})

		function loadName() {
			fetch('/showname')
				.then(response => {
					return response.json()
				})
				.then(data => {
					var titel = "Wetter - " + data.Name;
					document.title = titel;
					document.getElementById("device").innerHTML = data.Name;
					console.log(data)
				})
				.catch(err => {
					document.getElementById("device").style.color = "red";
					document.getElementById("device").innerHTML = "Keine Verbindung zum Display!";
				})
		}

	</SCRIPT>

</head>

<body>

	<div>

		<div class="aussen">
			<h1 id="device">
				<nobr>&nbsp;</nobr>
			</h1>

			<h2>Wetterinformationen</h2><br>


			<iframe marginheight='0' marginwidth='0' scrolling='no' width='300' height='365' name='FC3'
				style='border:0.2em solid; border-radius:1em; border-color:transparent; margin-bottom: 2em;'
