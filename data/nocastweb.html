    <meta charset="utf-8">

	<meta http-equiv="Cache-control" content="no-cache">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Castweb nicht aktiviert</title>
	
  <SCRIPT>                 
  
		window.addEventListener('load', () => {
		loadName();
		 })
				
		function loadName() {		 
          fetch('/showname')
			  .then(response => {
				return response.json()
				})
              .then(data => {
			    var titel = "Castweb nicht aktiviert - " + data.Name;
			    document.title = titel;
				document.getElementById("device").innerHTML = data.Name;
				console.log(data)
				})
			.catch(err => {
                document.getElementById("device").style.color = "red"; 
				document.getElementById("device").innerHTML = "Keine Verbindung zum Display!";
				})
		}
</SCRIPT>
</head>
