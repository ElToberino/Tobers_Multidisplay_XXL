			for (var i = 0; i < numofLogs; i++) {

				buf3 += '<div class="stamp" id="weathStamp' + i + '" style="display:none;"></div> <div class="apiurl" id="apiurlw' + i + '" style="display:none;">';

			aps += '<div id="W_Keys_2">';
			for (var k = 0; k < Number(numberofcities); k++) {
				aps += '<div class="source">';
				aps += '<div class="bez" >City ' + (k + 1) + ':</div><input id="cit_B' + k + '" style="margin-right:1em;" class="innerproform" type="text" name="City_B' + k + '" maxlength="50" value="">';
				aps += '</div><div class="source" style="margin-bottom:1em;">';
				aps += '<div class="bez" style="width:2em; margin-left:5em; margin-right:0.1em;">Lat</div><input id="lat_B' + k + '" class="innerproform" style="width:5em; margin-right:1em;" type="text" name="Lat_B' + k + '" maxlength="20" value="">';

				document.getElementById('lon_A' + i).pattern = coordPattern;
				document.getElementById('cit_B' + i).pattern = regi;
				document.getElementById('lat_B' + i).pattern = coordPattern;
				document.getElementById('lon_B' + i).pattern = coordPattern;

			// API KEY NEWS
			var aps2 = '<div id="api_1" class="apiname" style="margin-top:1em;" onclick="toggleKeys(\'N_Keys_1\')">newsapi.org <span class="indicator"></span></div>';
			aps2 += '<div id="N_Keys_1">';

		var android;

		function once(startup, form, savedStates) {
			fetch('/showAPI')
				.then(response => {
					return response.json()
				})
				.then(data => {
					android = data;
					var titel = "API-Verwaltung - " + data.Name;
					document.title = titel;
					document.getElementById("device").innerHTML = data.Name;
					numofLogs = data.NumOfLogs;
					numberofcities = data.NumOfCities;
					newssources = data.NewsSources;
					weatherslots = 2 * numberofcities;
					numofMusicLogs = data.NumOfMusicLogs;
					numofTimeLogs = data.NumOfTimeLogs;
					apiType = data.NewsApiType;
					apiTypeW = data.WeathApiType;
					if (form) {
						if (form != "Loader" && form != "Saver") {
							document.getElementById(form).children[0].className = "configsuccess";
							setTimeout(() => {
								document.getElementById(form).children[0].className = "config";
							}, 5000);
						} else {
							document.getElementById(form).children[0].style.background = "green";
							setTimeout(() => {
								document.getElementById(form).children[0].style.background = "";
							}, 3000);
						}
					}
					if (startup) dom(data);			// (data) -> when data finished
					//gogo(data);
					console.log(data)
				})
				.then(finishedData => {
					gogo(savedStates); // <--- Starts after the previous .then() finishes
				})
				.catch(err => {
					document.getElementById("showbox").innerHTML = "Keine Verbindung zum Display";
					document.getElementById("showbox").className = "configred";
				})
		}

		function gogo(savedStates) {
			for (var t = 0; t < newssources * 2; t++) {

				document.getElementById("n" + t).value = android["Source" + t];
			}
			// open-meteo cities + lat/lon
			for (var k = 0; k < Number(numberofcities); k++) {
				document.getElementById("cit_A" + k).value = android["City_A" + k] || "";
				document.getElementById("lat_A" + k).value = android["Lat_A" + k] || "";
				document.getElementById("lon_A" + k).value = android["Lon_A" + k] || "";
				document.getElementById("cit_B" + k).value = android["City_B" + k] || "";
				document.getElementById("lat_B" + k).value = android["Lat_B" + k] || "";
				document.getElementById("lon_B" + k).value = android["Lon_B" + k] || "";
			}
			//for (var k=0;k<newssources;k++){
			//var getter="Source"+k;
			//document.getElementById("n"+(k+4)).value = android["Source"+k];
			//}
			if (apiType == 0) {
				document.getElementById("api_1").style.color = "green";
				document.getElementById("api_2").style.color = "red";
				document.getElementById("N_Keys_1").style.display = "";
				document.getElementById("N_Keys_2").style.display = "none";
			}
			if (apiType == 1) {
				document.getElementById("api_1").style.color = "red";
				document.getElementById("api_2").style.color = "green";
				document.getElementById("N_Keys_1").style.display = "none";
				document.getElementById("N_Keys_2").style.display = "";
			}
			if (apiType == 99) {
				document.getElementById("api_1").style.color = "green";
				document.getElementById("api_2").style.color = "green";
				document.getElementById("N_Keys_1").style.display = "";
				document.getElementById("N_Keys_2").style.display = "";
			}

			if (apiTypeW == 0) {
				document.getElementById("apiW_1").style.color = "green";
				document.getElementById("apiW_2").style.color = "red";
				document.getElementById("W_Keys_1").style.display = "";
				document.getElementById("W_Keys_2").style.display = "none";
			}
			if (apiTypeW == 1) {
				document.getElementById("apiW_1").style.color = "red";
				document.getElementById("apiW_2").style.color = "green";
				document.getElementById("W_Keys_1").style.display = "none";
				document.getElementById("W_Keys_2").style.display = "";
			}
			if (apiTypeW == 99) {
				document.getElementById("apiW_1").style.color = "green";
				document.getElementById("apiW_2").style.color = "green";
				document.getElementById("W_Keys_1").style.display = "";
				document.getElementById("W_Keys_2").style.display = "";
			}
			updateIndicator("N_Keys_1");
			updateIndicator("N_Keys_2");
			updateIndicator("W_Keys_1");
			updateIndicator("W_Keys_2");

			// Restore toggle states if saved
			if (savedStates) {
				var keys = ["W_Keys_1", "W_Keys_2", "N_Keys_1", "N_Keys_2"];
				for (var i = 0; i < keys.length; i++) {
					if (savedStates[keys[i]] !== undefined) {
						document.getElementById(keys[i]).style.display = savedStates[keys[i]];
					}
				}
				updateIndicator("N_Keys_1");
				updateIndicator("N_Keys_2");
				updateIndicator("W_Keys_1");
				updateIndicator("W_Keys_2");
			}
		}


		function validateNews(id, nums, max, form, info) {
			var counts = 0;
			for (var t = 0; t < nums; t++) {
				var versuch = document.getElementById(id + t).value;
				var toberREGEX = /[\}\{\\\"]/;                                 //siehe Simulator auf https://www.regextester.com/97777
				if (versuch.length <= Number(max)) {
					var result = toberREGEX.test(versuch);
					if (result == true) {
						document.getElementById("showbox").innerHTML = "Falsche Zeichen! Nicht erlaubt sind: }  {  \\  \" <br>";
						document.getElementById("showbox").className = "configred";
						document.getElementById("newsForm").children[0].className = "configfault";
					}
					else {
						counts++;
					}
				} else {
					document.getElementById("showbox").innerHTML = "Es sind maximal " + max + " Zeichen erlaubt!";
					document.getElementById("showbox").className = "configred";
					document.getElementById("newsForm").children[0].className = "configfault";
				}

			}
			if (counts == nums)
				//document.getElementById("showbox").innerHTML = "paletti";
				//document.getElementById("showbox").className = "configred";}
				SendeFunction(form, info);
		}

		function validateWeather() {
			var counts = 0;
			var totalFields = 0;
			var toberREGEX = /[\}\{\\\"]/;
			var coordRegex = /^-?\d+(\.\d+)?$/;
			var prefixes = ["_A", "_B"];  // both API providers
			for (var p = 0; p < prefixes.length; p++) {
				var prefix = prefixes[p];
				for (var k = 0; k < Number(numberofcities); k++) {
					// City name
					totalFields++;
					var cityVal = document.getElementById("cit" + prefix + k).value;
					if (cityVal.length > 50) {
						document.getElementById("showbox").innerHTML = "City: Maximal 50 Zeichen erlaubt!";
						document.getElementById("showbox").className = "configred";
						document.getElementById("weatherForm").children[0].className = "configfault";
						return;
					}
					if (toberREGEX.test(cityVal)) {
						document.getElementById("showbox").innerHTML = "Falsche Zeichen! Nicht erlaubt sind: }  {  \\  \" <br>";
						document.getElementById("showbox").className = "configred";
						document.getElementById("weatherForm").children[0].className = "configfault";
						return;
					}
					counts++;
					// Latitude
					totalFields++;
					var latVal = document.getElementById("lat" + prefix + k).value;
					if (latVal.length > 20) {
						document.getElementById("showbox").innerHTML = "Lat: Maximal 20 Zeichen erlaubt!";
						document.getElementById("showbox").className = "configred";
						document.getElementById("weatherForm").children[0].className = "configfault";
						return;
					}
					if (latVal !== "" && !coordRegex.test(latVal)) {
						document.getElementById("showbox").innerHTML = "Lat muss eine Zahl sein!";
						document.getElementById("showbox").className = "configred";
						document.getElementById("weatherForm").children[0].className = "configfault";
						return;
					}
					counts++;
					// Longitude
					totalFields++;
					var lonVal = document.getElementById("lon" + prefix + k).value;
					if (lonVal.length > 20) {
						document.getElementById("showbox").innerHTML = "Lon: Maximal 20 Zeichen erlaubt!";
						document.getElementById("showbox").className = "configred";
						document.getElementById("weatherForm").children[0].className = "configfault";
						return;
					}
					if (lonVal !== "" && !coordRegex.test(lonVal)) {
						document.getElementById("showbox").innerHTML = "Lon muss eine Zahl sein!";
						document.getElementById("showbox").className = "configred";
						document.getElementById("weatherForm").children[0].className = "configfault";
						return;
					}
					counts++;
				}
			}
			if (counts == totalFields) {
				SendeFunction('weatherForm', 'Wetter API-Parameter gesetzt!');
			}
		}



		function SendeFunction(form, info) {
			// Save current toggle states before refresh
			var savedStates = {};
			var keys = ["W_Keys_1", "W_Keys_2", "N_Keys_1", "N_Keys_2"];
			for (var i = 0; i < keys.length; i++) {
				var el = document.getElementById(keys[i]);
				if (el) savedStates[keys[i]] = el.style.display;
			}

			document.getElementById(form).submit();
			setTimeout(() => {
				once(false, form, savedStates);
			}, 500);
			document.getElementById("showbox").innerHTML = info;
			document.getElementById("showbox").className = "configgreen";
			setTimeout(() => {
				document.getElementById("showbox").className = "configinvisible";
			}, 8000);
		}

						timestamps.push(data["Stamp" + k]);
					}

					timestamps.reverse();
					console.log(timestamps);
					for (var i = 0; i < numofLogs; i++) {

						var type = data["Type" + i];

						if (type == "1") document.getElementById("header" + pos).innerHTML = "thenewsapi.com";
						console.log(pos);
						console.log("PAUSE");
						if (data["Stamp" + i] != "") {
							document.getElementById("newsStamp" + pos).innerHTML = data["Stamp" + i];
							document.getElementById("apiurl" + pos).style.display = "";
							document.getElementById("newsStamp" + pos).style.display = "";
							document.getElementById("header" + pos).style.display = "";

		function showLogMusic() {
			fetch('/showLogMusic')
				.then(response => {
					return response.json()
				})
				.then(data => {
					LogArray = data.LOGS;

					var symbol;
					var logtime;

					LogArray.sort();											//see: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort
					LogArray.reverse();
					for (var i = 0; i < LogArray.length; i++) {
						if (LogArray[i] != "") {
							logtime = LogArray[i].substr(0, 22);
							symbol = LogArray[i].substring(LogArray[i].length - 8);																		//and  https://stackoverflow.com/questions/10841868/move-n-characters-from-front-of-string-to-the-end
							LogArray[i] = LogArray[i].substring(0, LogArray[i].length - 8);
							LogArray[i] = LogArray[i].substring(22);
							document.getElementById("slot" + i).style.display = "";
						} else {
							document.getElementById("slot" + i).style.display = "none";
							symbol = "";
						}
						document.getElementById("mus" + i).innerHTML = LogArray[i];
						document.getElementById("symb" + i).innerHTML = symbol;
						document.getElementById("dat" + i).innerHTML = logtime;
					}
					
					var remDays = parseInt(data.Remaining, 10); // Als Zahl einlesen
					var element = document.getElementById("remaining");

					if (remDays < 0) {
					element.style.color = "red";
					element.style.fontWeight = "bold"; 
					element.innerHTML = "Achtung! Spotify Refreshtoken ist seit " + Math.abs(remDays) + " Tagen abgelaufen!";

					element.innerHTML = "Spotify Refreshtoken noch gültig für " + remDays + " Tage.";

				document.getElementById("n_switch").innerHTML = "Show Log";

			}

		// New simple toggle function:
		function toggleKeys(id) {
			var el = document.getElementById(id);
			var titleEl = el.previousElementSibling;
			if (titleEl.style.color === "green") return;  // ← don't toggle active APIs
			var ind = titleEl.querySelector('.indicator');
			if (el.style.display === "none") {
				el.style.display = "";
				ind.innerHTML = "&nbsp;&nbsp; \u2716";
			} else {
				el.style.display = "none";
				ind.innerHTML = "&nbsp;&nbsp; \u25BC";
			}
		}

		function updateIndicator(keysId) {
			var el = document.getElementById(keysId);
			var titleEl = el.previousElementSibling;
			var isRed = (titleEl.style.color === "red");
			var ind = titleEl.querySelector('.indicator');
			if (!isRed) {
				ind.innerHTML = "";
				titleEl.style.cursor = "default";     // ← no pointer on green
				return;
			}
			titleEl.style.cursor = "pointer";         // ← pointer on red
			ind.innerHTML = (el.style.display === "none") ? "&nbsp;&nbsp; \u25BC" : "&nbsp;&nbsp; \u2716";
		}
